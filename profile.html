<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Espace Vendeur - Connexion</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" />
  </head>
  <body class="bg-slate-50 min-h-screen flex items-center justify-center p-4 font-sans">
    <div class="bg-white w-full max-w-md rounded-2xl shadow-xl border border-gray-100 overflow-hidden">
      <div class="bg-[#8E5F44] p-6 text-center">
        <div class="w-16 h-16 bg-white rounded-full flex items-center justify-center mx-auto mb-3 shadow-inner">
          <i class="bi bi-person-circle text-3xl text-[#8E5F44]"></i>
        </div>
        <h2 class="text-2xl font-bold text-white">Espace Vendeur</h2>
        <p class="text-amber-100 text-sm mt-1">Gérez votre boutique en toute simplicité</p>
      </div>

      <div class="p-8">
        <div id="loginFormContainer" class="block">
          <h3 class="text-xl font-bold text-gray-800 mb-6 text-center">Bon retour !</h3>

          <div class="mb-4">
            <label class="block text-sm font-medium text-gray-600 mb-2">Adresse Email</label>
            <div class="relative">
              <i class="bi bi-envelope absolute left-4 top-3.5 text-gray-400"></i>
              <input
                type="email"
                id="loginEmail"
                placeholder="votre@email.com"
                class="w-full pl-11 pr-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-[#8E5F44] focus:border-transparent transition"
              />
            </div>
          </div>

          <div class="mb-6">
            <label class="block text-sm font-medium text-gray-600 mb-2">Mot de passe</label>
            <div class="relative">
              <i class="bi bi-lock absolute left-4 top-3.5 text-gray-400"></i>
              <input
                type="password"
                id="loginPassword"
                placeholder="••••••••"
                class="w-full pl-11 pr-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-[#8E5F44] focus:border-transparent transition"
              />
            </div>
          </div>

          <button
            id="btnLogin"
            class="w-full bg-[#8E5F44] text-white font-semibold py-3 rounded-xl shadow-md hover:bg-amber-700 transition duration-150 flex justify-center items-center"
          >
            <i class="bi bi-box-arrow-in-right mr-2 text-lg"></i>
            Se connecter
          </button>

          <p class="text-center text-sm text-gray-500 mt-6">
            Nouveau vendeur ?
            <button id="btnShowRegister" class="text-[#8E5F44] font-bold hover:underline">Créer un compte</button>
          </p>
        </div>

        <div id="registerFormContainer" class="hidden">
          <h3 class="text-xl font-bold text-gray-800 mb-6 text-center">Rejoignez-nous</h3>

          <div class="mb-4">
            <label class="block text-sm font-medium text-gray-600 mb-2">Nom de la boutique</label>
            <div class="relative">
              <i class="bi bi-shop absolute left-4 top-3.5 text-gray-400"></i>
              <input
                type="text"
                id="registerName"
                placeholder="Ex: MaBoutique Pro"
                class="w-full pl-11 pr-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-[#8E5F44] focus:border-transparent transition"
              />
            </div>
          </div>

          <div class="mb-4">
            <label class="block text-sm font-medium text-gray-600 mb-2">Adresse Email</label>
            <div class="relative">
              <i class="bi bi-envelope absolute left-4 top-3.5 text-gray-400"></i>
              <input
                type="email"
                id="registerEmail"
                placeholder="votre@email.com"
                class="w-full pl-11 pr-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-[#8E5F44] focus:border-transparent transition"
              />
            </div>
          </div>

          <div class="mb-6">
            <label class="block text-sm font-medium text-gray-600 mb-2">Mot de passe</label>
            <div class="relative">
              <i class="bi bi-lock absolute left-4 top-3.5 text-gray-400"></i>
              <input
                type="password"
                id="registerPassword"
                placeholder="••••••••"
                class="w-full pl-11 pr-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-[#8E5F44] focus:border-transparent transition"
              />
            </div>
          </div>

          <button
            id="btnRegister"
            class="w-full bg-gray-800 text-white font-semibold py-3 rounded-xl shadow-md hover:bg-gray-900 transition duration-150 flex justify-center items-center"
          >
            <i class="bi bi-person-plus mr-2 text-lg"></i>
            S'inscrire
          </button>

          <p class="text-center text-sm text-gray-500 mt-6">
            Déjà un compte ?
            <button id="btnShowLogin" class="text-[#8E5F44] font-bold hover:underline">Se connecter</button>
          </p>
        </div>
      </div>
    </div>
    <script src="js/profil.js"></script>
  </body>
</html>
