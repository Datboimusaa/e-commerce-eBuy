<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panier</title>
    <link href="./css/output.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
  </head>
  <body class="bg-gray-100 flex flex-col items-center">
    <main class="w-full min-h-screen flex gap-4 flex-col items-center">
      <div class="max-w-6xl mx-auto min-h-screen bg-white rounded-3xl shadow-sm border border-slate-100 p-6 md:p-10">
        <div class="flex justify-between items-center mb-8">
          <h1 class="text-3xl font-bold text-slate-800">Ebuy</h1>
          <button class="btn btn-ghost bg-slate-50 rounded-full px-6">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"
              />
            </svg>
            Mon Panier <span id="nombreArticle" class="badge badge-sm ml-2">5</span>
          </button>
        </div>

        <a href="/product.html" class="text-slate-400 flex items-center gap-2 text-sm hover:text-indigo-600 transition-colors mb-6">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
          </svg>
          Continuer vos achats
        </a>

        <h2 class="text-3xl font-extrabold text-slate-900 mb-2">Votre Panier</h2>
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-10">
          <div class="lg:col-span-2 space-y-4 mt-2" id="lesCommandes"></div>

          <div class="space-y-6">
            <div class="bg-white border border-slate-100 rounded-3xl p-8 shadow-sm">
              <div class="flex justify-between items-center mb-8">
                <span class="text-indigo-600 font-medium cursor-pointer">Code de réduction</span>
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-slate-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M15 5v2m0 4v2m0 4v2M5 5a2 2 0 00-2 2v3a2 2 0 110 4v3a2 2 0 002 2h14a2 2 0 002-2v-3a2 2 0 110-4V7a2 2 0 00-2-2H5z"
                  />
                </svg>
              </div>

              <div class="flex justify-between items-center mb-2 text-xl">
                <span class="font-bold text-slate-800">Sous-total :</span>
                <span class="font-black text-slate-900" id="totalPanier"></span>
              </div>
              <p class="text-xs text-slate-400 leading-relaxed mb-8">Les frais de livraison seront calculés lors du paiement.</p>

              <button
                id="btnModalCommande"
                class="btn btn-primary w-full bg-[#8E5F44] hover:bg-amber-700 transition duration-150 border-none text-white rounded-xl h-14 text-lg"
              >
                Commander
              </button>
            </div>
          </div>
        </div>
      </div>
    </main>

    <dialog id="modalCommande" class="modal">
      <div class="modal-box bg-white rounded-2xl max-w-lg shadow-2xl">
        <form method="dialog">
          <button class="btn btn-sm btn-circle btn-ghost absolute right-4 top-4 text-gray-500 hover:bg-gray-100">✕</button>
        </form>

        <h3 class="text-2xl font-bold text-gray-800 mb-2"><i class="bi bi-box-seam text-[#8E5F44] mr-2"></i> Finaliser la commande</h3>
        <p class="text-gray-500 text-sm mb-6 border-b pb-4 border-gray-100">Veuillez renseigner vos informations pour la livraison.</p>

        <form id="formCommande" class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-gray-600 mb-1">Nom complet</label>
            <div class="relative">
              <i class="bi bi-person absolute left-4 top-3.5 text-gray-400"></i>
              <input
                type="text"
                id="clientNom"
                placeholder="Ex: Babacar..."
                class="w-full pl-11 pr-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-[#8E5F44] transition"
                required
              />
            </div>
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-600 mb-1">Numéro de téléphone</label>
            <div class="relative">
              <i class="bi bi-telephone absolute left-4 top-3.5 text-gray-400"></i>
              <input
                type="tel"
                id="clientTelephone"
                placeholder="Ex: +221 77 000 00 00"
                class="w-full pl-11 pr-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-[#8E5F44] transition"
                required
              />
            </div>
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-600 mb-1">Adresse de livraison détaillée</label>
            <textarea
              id="clientAdresse"
              rows="3"
              placeholder="Ex: Pikine, Dakar - Près de la pharmacie..."
              class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-[#8E5F44] transition"
              required
            ></textarea>
          </div>

          <div class="bg-amber-50 rounded-xl p-4 mt-2 border border-amber-100 flex justify-between items-center">
            <span class="text-amber-800 font-medium">Total à payer :</span>
            <span id="modalTotalPrix" class="text-xl font-bold text-[#8E5F44]">0 FCFA</span>
          </div>
          <div class="mt-6 flex justify-end gap-3 pt-4 border-t border-gray-100">
            <button type="submit" class="px-6 py-3 rounded-xl bg-[#8E5F44] text-white font-medium hover:bg-amber-700 transition shadow-md flex items-center">
              <i class="bi bi-check2-circle mr-2 text-lg"></i>
              Confirmer l'achat
            </button>
          </div>
        </form>
      </div>
    </dialog>
    <script type="module" src="/js/produts.js"></script>
  </body>
</html>
